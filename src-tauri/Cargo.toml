[package]
name = "sdigitalcore-desktop"
version = "0.1.0"
description = "Contenedor de escritorio para SDigitalCore"
authors = ["SDigitalCore"]
edition = "2021"

[lib]
name = "sdigitalcore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fcm = "0.1.9"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
